<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Discord Username Checker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>

<div id="splash">
  <p>made with <svg class="splash-heart" viewBox="0 0 24 24" fill="#f87171" xmlns="http://www.w3.org/2000/svg"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> by sqajy</p>
</div>

<header>
  <span class="app-name">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="15" height="15"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    Username Checker
  </span>
  <nav>
    <button class="active" onclick="showTab('scan', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="14" height="14"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Scan
    </button>
    <button onclick="showTab('history', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      History
    </button>
    <button onclick="showTab('settings', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="14" height="14"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      Settings
    </button>
  </nav>
</header>

<main>

  <!-- ═══════════════ SCAN ═══════════════ -->
  <div id="tab-scan" class="panel active">

    <div class="scan-controls">
      <select id="mode-select" onchange="onModeChange()">
        <option value="2">2 chars (tout)</option>
        <option value="3">3 chars (tout)</option>
        <option value="4a">4 chiffres</option>
        <option value="4b">4 lettres</option>
        <option value="4c">3 chiffres + i/l</option>
        <option value="4d">3 chiffres + _</option>
        <option value="4e">3 lettres + _</option>
        <option value="4f">3 chiffres + .</option>
        <option value="4g">3 lettres + .</option>
        <option value="5a">5 lettres</option>
        <option value="5b">5 chiffres</option>
      </select>

      <button class="btn btn-start" id="btn-start" onclick="startScan()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Start
      </button>
      <button class="btn btn-stop" id="btn-stop" onclick="stopScan()" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" width="11" height="11"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        Stop
      </button>
      <button class="btn btn-reset" id="btn-reset" onclick="resetProgress()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="12" height="12"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>

      <label class="verbose-wrap">
        <input type="checkbox" id="chk-verbose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="13" height="13"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        verbose
      </label>

      <span class="proxy-badge" id="proxy-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="12" height="12"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        <span id="proxy-count">—</span> proxies
      </span>
    </div>

    <div class="scan-body">

      <div class="console" id="console"></div>

      <aside class="stats-side">
        <div class="stat">
          <span class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="11" height="11"><polyline points="20 6 9 17 4 12"/></svg>
            Vérifiés
          </span>
          <span class="stat-value" id="s-checked">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="11" height="11"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
            Total
          </span>
          <span class="stat-value" id="s-total">—</span>
        </div>
        <div class="stat stat-found">
          <span class="stat-label">
            <svg viewBox="0 0 24 24" fill="var(--green)" width="11" height="11"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Trouvés
          </span>
          <span class="stat-value green" id="s-found">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">
            <svg viewBox="0 0 24 24" fill="var(--amber)" width="11" height="11"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Vitesse
          </span>
          <span class="stat-value" id="s-speed">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="11" height="11"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ETA
          </span>
          <span class="stat-value" id="s-eta">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="11" height="11"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
            Progression
          </span>
          <span class="stat-value" id="s-pct">0%</span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </aside>

    </div>

  </div>

  <!-- ═══════════════ HISTORY ═══════════════ -->
  <div id="tab-history" class="panel">
    <div class="panel-header">
      <span class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="13" height="13"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Résultats trouvés
      </span>
      <span class="count-badge" id="history-count"></span>
      <button class="btn-link" onclick="clearHistory()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="12" height="12"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        Tout effacer
      </button>
    </div>
    <div class="history-table-wrap" id="history-content">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" width="40" height="40" style="margin-bottom:12px;opacity:0.3"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <div>Aucun username trouvé pour l'instant.</div>
      </div>
    </div>
  </div>

  <!-- ═══════════════ SETTINGS ═══════════════ -->
  <div id="tab-settings" class="panel">

    <div class="settings-block">
      <span class="settings-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="13" height="13"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.06 6.06l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Webhooks Discord
      </span>
      <div class="wh-grid">
        <span class="wh-key">Checker</span>
        <input class="wh-input" id="wh-checker" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">2 chars</span>
        <input class="wh-input" id="wh-2"  placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">3 chars</span>
        <input class="wh-input" id="wh-3"  placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4a</span>
        <input class="wh-input" id="wh-4a" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4b</span>
        <input class="wh-input" id="wh-4b" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4c</span>
        <input class="wh-input" id="wh-4c" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4d</span>
        <input class="wh-input" id="wh-4d" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4e</span>
        <input class="wh-input" id="wh-4e" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4f</span>
        <input class="wh-input" id="wh-4f" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4g</span>
        <input class="wh-input" id="wh-4g" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">5a</span>
        <input class="wh-input" id="wh-5a" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">5b</span>
        <input class="wh-input" id="wh-5b" placeholder="https://discord.com/api/webhooks/…">
      </div>
    </div>

    <div class="settings-footer">
      <button class="btn-save" onclick="saveSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="13" height="13"><polyline points="20 6 9 17 4 12"/></svg>
        Sauvegarder
      </button>
      <span class="save-status" id="save-status">✓ Sauvegardé</span>
    </div>

    <div class="settings-block">
      <span class="settings-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="13" height="13"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        Proxies
      </span>
      <div class="proxy-info-box" id="proxy-info-box">Chargement…</div>
    </div>

  </div>

</main>

<script src="app.js"></script>

</body>
</html>
