<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Discord Username Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="app-name">Username Checker</span>
  <nav>
    <button class="active" onclick="showTab('scan', this)">Scan</button>
    <button onclick="showTab('history', this)">History</button>
    <button onclick="showTab('settings', this)">Settings</button>
  </nav>
</header>

<main>

  <!-- ═══════════════ SCAN ═══════════════ -->
  <div id="tab-scan" class="panel active">

    <div class="scan-controls">
      <select id="mode-select" onchange="onModeChange()">
        <option value="2">2 chars (tout)</option>
        <option value="3">3 chars (tout)</option>
        <option value="4a">4 chiffres</option>
        <option value="4b">4 lettres</option>
        <option value="4c">3 chiffres + i/l</option>
        <option value="4d">3 chiffres + _</option>
        <option value="4e">3 lettres + _</option>
        <option value="4f">3 chiffres + .</option>
        <option value="4g">3 lettres + .</option>
        <option value="5a">5 lettres</option>
        <option value="5b">5 chiffres</option>
      </select>

      <button class="btn btn-start" id="btn-start" onclick="startScan()">▶ Start</button>
      <button class="btn btn-stop"  id="btn-stop"  onclick="stopScan()"  disabled>■ Stop</button>
      <button class="btn btn-reset" id="btn-reset" onclick="resetProgress()">↺ Reset</button>

      <label class="verbose-wrap">
        <input type="checkbox" id="chk-verbose">
        verbose
      </label>

      <span class="proxy-badge" id="proxy-badge">— proxies</span>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">Vérifiés</span>
        <span class="stat-value" id="s-checked">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="s-total">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Trouvés</span>
        <span class="stat-value green" id="s-found">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Vitesse</span>
        <span class="stat-value" id="s-speed">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">ETA</span>
        <span class="stat-value" id="s-eta">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">%</span>
        <span class="stat-value" id="s-pct">0%</span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="console" id="console"></div>

  </div>

  <!-- ═══════════════ HISTORY ═══════════════ -->
  <div id="tab-history" class="panel">
    <div class="panel-header">
      <span class="panel-title">Résultats trouvés</span>
      <span class="count-badge" id="history-count"></span>
      <button class="btn-link" onclick="clearHistory()">Tout effacer</button>
    </div>
    <div class="history-table-wrap" id="history-content">
      <div class="empty-state">Aucun username trouvé pour l'instant.</div>
    </div>
  </div>

  <!-- ═══════════════ SETTINGS ═══════════════ -->
  <div id="tab-settings" class="panel">

    <div class="settings-block">
      <span class="settings-label">Webhooks Discord</span>
      <div class="wh-grid">
        <span class="wh-key">Checker</span>
        <input class="wh-input" id="wh-checker" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">2 chars</span>
        <input class="wh-input" id="wh-2"  placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">3 chars</span>
        <input class="wh-input" id="wh-3"  placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4a</span>
        <input class="wh-input" id="wh-4a" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4b</span>
        <input class="wh-input" id="wh-4b" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4c</span>
        <input class="wh-input" id="wh-4c" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4d</span>
        <input class="wh-input" id="wh-4d" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4e</span>
        <input class="wh-input" id="wh-4e" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4f</span>
        <input class="wh-input" id="wh-4f" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">4g</span>
        <input class="wh-input" id="wh-4g" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">5a</span>
        <input class="wh-input" id="wh-5a" placeholder="https://discord.com/api/webhooks/…">

        <span class="wh-key">5b</span>
        <input class="wh-input" id="wh-5b" placeholder="https://discord.com/api/webhooks/…">
      </div>
    </div>

    <div class="settings-footer">
      <button class="btn-save" onclick="saveSettings()">Sauvegarder</button>
      <span class="save-status" id="save-status">✓ Sauvegardé</span>
    </div>

    <div class="settings-block">
      <span class="settings-label">Proxies</span>
      <div class="proxy-info-box" id="proxy-info-box">Chargement…</div>
    </div>

  </div>

</main>

<script src="app.js"></script>

</body>
</html>
